name: analisabee-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: analisabee
      POSTGRES_PASSWORD: analisabee
      POSTGRES_DB: analisabee
    ports:
      - "5432:5432"
    volumes:
      - analisabee_dev_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analisabee"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  analisabee_dev_db:
