services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: analisabee
      POSTGRES_USER: analisabee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diset di .env}
    volumes:
      # Bind-mount, NOT a Docker named volume — deliberately, after an incident
      # (2026-09-07) where a named volume's data was silently wiped by an
      # unrelated `rm -rf` on a Docker internal path, because it was invisible
      # inside Docker's own data-root. A bind-mount puts the data in a plain,
      # visible folder right next to the project, so it can be seen, copied,
      # and backed up like any other file — see scripts/backup-db.sh.
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analisabee"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:3001"
    environment:
      DATABASE_URL: postgresql://analisabee:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diset di .env}@db:5432/analisabee
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET wajib diset di .env}
      MASTER_PASSWORD: ${MASTER_PASSWORD:?MASTER_PASSWORD wajib diset di .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NODE_ENV: production
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
