services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: analisabee
      POSTGRES_USER: analisabee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analisabee"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:3001"
    environment:
      DATABASE_URL: postgresql://analisabee:${POSTGRES_PASSWORD:-changeme}@db:5432/analisabee
      SESSION_SECRET: ${SESSION_SECRET}
      APP_PASSWORD: ${APP_PASSWORD}
      NODE_ENV: production
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
